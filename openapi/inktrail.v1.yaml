openapi: 3.0.3
info:
  title: InkTrail Foundation API
  version: 1.0.0
  description: Local-first novel library and reader API.
servers:
  - url: http://127.0.0.1:4277
security: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check service health
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/novels:
    get:
      operationId: listNovels
      summary: List novels
      responses:
        '200':
          description: Novel library
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NovelDetail'
    post:
      operationId: createNovel
      summary: Create a novel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNovelInput'
            example:
              title: Return of the War God
              sourceUrl: https://example.test/book/war-god
      responses:
        '201':
          description: Novel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Novel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/novels/{novelId}:
    parameters:
      - $ref: '#/components/parameters/NovelId'
    get:
      operationId: getNovel
      summary: Get a novel and its reading progress
      responses:
        '200':
          description: Novel detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NovelDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/novels/{novelId}/chapters:
    parameters:
      - $ref: '#/components/parameters/NovelId'
    post:
      operationId: recordChapter
      summary: Record a chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChapterInput'
            example:
              chapterNumber: 1
              title: Arrival
              originalText: Original Chinese
      responses:
        '201':
          description: Chapter recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/novels/{novelId}/source-chapters:
    parameters:
      - $ref: '#/components/parameters/NovelId'
    post:
      operationId: importSourceChapter
      summary: Import one supported source chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceChapterImportInput'
            example:
              sourceUrl: https://www.kujiang.com/book/9/906595
              chapterNumber: 2491
      responses:
        '200':
          description: Source chapter was already imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceChapterImport'
        '201':
          description: Source chapter imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceChapterImport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/SourceFetchFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/novels/{novelId}/chapters/{chapterNumber}:
    parameters:
      - $ref: '#/components/parameters/NovelId'
      - $ref: '#/components/parameters/ChapterNumber'
    get:
      operationId: getReaderChapter
      summary: Get a reader chapter
      responses:
        '200':
          description: Reader chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderChapter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/novels/{novelId}/chapters/{chapterNumber}/translations:
    parameters:
      - $ref: '#/components/parameters/NovelId'
      - $ref: '#/components/parameters/ChapterNumber'
    post:
      operationId: translateChapter
      summary: Translate one imported source chapter
      responses:
        '201':
          description: Translation revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/TranslationProviderFailed'
  /api/v1/novels/{novelId}/chapters/{chapterNumber}/feedback:
    parameters:
      - $ref: '#/components/parameters/NovelId'
      - $ref: '#/components/parameters/ChapterNumber'
    get:
      operationId: listChapterFeedback
      summary: List feedback reports for a chapter
      responses:
        '200':
          description: Chapter feedback reports
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedbackReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: submitChapterFeedback
      summary: Submit translation feedback for a chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmissionInput'
      responses:
        '201':
          description: Feedback report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/novels/{novelId}/feedback/{reportId}:
    parameters:
      - $ref: '#/components/parameters/NovelId'
      - $ref: '#/components/parameters/ReportId'
    patch:
      operationId: decideFeedback
      summary: Verify a feedback report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackDecisionInput'
      responses:
        '200':
          description: Feedback decision saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackDecision'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/novels/{novelId}/verified-memory:
    parameters:
      - $ref: '#/components/parameters/NovelId'
    get:
      operationId: listVerifiedMemory
      summary: List verified memory for a novel
      responses:
        '200':
          description: Verified novel memory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemoryEntry'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/novels/{novelId}/reading-progress:
    parameters:
      - $ref: '#/components/parameters/NovelId'
    patch:
      operationId: setReadingProgress
      summary: Set reading progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetReadingProgressInput'
            example:
              chapterNumber: 1
      responses:
        '200':
          description: Reading progress saved
          content:
            application/json:
              schema:
                type: object
                required: [readingProgress]
                properties:
                  readingProgress:
                    $ref: '#/components/schemas/ReadingProgress'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
components:
  parameters:
    NovelId:
      name: novelId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ChapterNumber:
      name: chapterNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Invalid request data or malformed JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Request body is not JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested novel or chapter does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: A chapter with this number already exists for the novel
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SourceFetchFailed:
      description: A supported source chapter could not be fetched or parsed. This error is retryable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: source_fetch_failed
              message: Source chapter could not be fetched
              retryable: true
    TranslationProviderFailed:
      description: The local translation provider could not complete the request. This error is retryable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: translation_provider_failed
              message: Translation provider could not complete the request
              retryable: true
    InternalError:
      description: Unexpected source import failure. This error is retryable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateNovelInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        sourceUrl:
          type: string
          format: uri
    CreateChapterInput:
      type: object
      required: [chapterNumber, title, originalText]
      properties:
        chapterNumber:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        originalText:
          type: string
          minLength: 1
        sourceUrl:
          type: string
          format: uri
    SourceChapterImportInput:
      type: object
      required: [sourceUrl, chapterNumber]
      properties:
        sourceUrl:
          type: string
          format: uri
          description: Kujiang chapter URL using HTTPS and the exact `/book/<positive-book-id>/<positive-chapter-id>` path. Query strings and fragments are discarded during canonicalization.
          pattern: '^https://www\.kujiang\.com/book/[1-9][0-9]*/[1-9][0-9]*(?:[?#].*)?$'
          example: https://www.kujiang.com/book/9/906595
        chapterNumber:
          type: integer
          minimum: 1
    SetReadingProgressInput:
      type: object
      required: [chapterNumber]
      properties:
        chapterNumber:
          type: integer
          minimum: 1
    Novel:
      type: object
      required: [id, title, sourceUrl, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sourceUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NovelDetail:
      allOf:
        - $ref: '#/components/schemas/Novel'
        - type: object
          required: [readingProgress]
          properties:
            readingProgress:
              type: object
              allOf:
                - $ref: '#/components/schemas/ReadingProgress'
              nullable: true
    Chapter:
      type: object
      required: [id, novelId, chapterNumber, title, originalText, sourceUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        novelId:
          type: string
          format: uuid
        chapterNumber:
          type: integer
          minimum: 1
        title:
          type: string
        originalText:
          type: string
        sourceUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
    ReaderChapter:
      allOf:
        - $ref: '#/components/schemas/Chapter'
        - type: object
          required: [translationRevisionId, translatedText, provider, model, revision, previousChapterNumber, nextChapterNumber]
          properties:
            translationRevisionId:
              type: string
              format: uuid
              nullable: true
            translatedText:
              type: string
              nullable: true
            provider:
              type: string
              nullable: true
            model:
              type: string
              nullable: true
            revision:
              type: integer
              nullable: true
            previousChapterNumber:
              type: integer
              nullable: true
            nextChapterNumber:
              type: integer
              nullable: true
    SourceChapterImport:
      type: object
      required: [chapter, source]
      properties:
        chapter:
          $ref: '#/components/schemas/ReaderChapter'
        source:
          $ref: '#/components/schemas/ChapterSource'
    ChapterSource:
      type: object
      required:
        - id
        - novelId
        - chapterId
        - novelSourceId
        - site
        - externalChapterId
        - sourceUrl
        - normalizedUrl
        - sourceTitle
        - fetchedAt
        - contentSha256
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        novelId:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        novelSourceId:
          type: string
          format: uuid
        site:
          type: string
        externalChapterId:
          type: string
        sourceUrl:
          type: string
          format: uri
        normalizedUrl:
          type: string
          format: uri
        sourceTitle:
          type: string
        previousSourceUrl:
          type: string
          format: uri
          nullable: true
        nextSourceUrl:
          type: string
          format: uri
          nullable: true
        fetchedAt:
          type: string
          format: date-time
        contentSha256:
          type: string
        createdAt:
          type: string
          format: date-time
    ReadingProgress:
      type: object
      required: [novelId, chapterNumber, updatedAt]
      properties:
        novelId:
          type: string
          format: uuid
        chapterNumber:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    TranslationRevision:
      type: object
      required: [id, chapterId, revision, translatedText, provider, model, createdAt]
      properties:
        id:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        translatedText:
          type: string
        provider:
          type: string
        model:
          type: string
        createdAt:
          type: string
          format: date-time
    TranslationQualityFinding:
      type: object
      required: [id, novelId, translationRevisionId, kind, details, createdAt]
      properties:
        id:
          type: string
          format: uuid
        novelId:
          type: string
          format: uuid
        translationRevisionId:
          type: string
          format: uuid
        kind:
          type: string
        details:
          type: string
        createdAt:
          type: string
          format: date-time
    TranslationResult:
      type: object
      required: [revision, findings]
      properties:
        revision:
          $ref: '#/components/schemas/TranslationRevision'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/TranslationQualityFinding'
    FeedbackSubmissionInput:
      type: object
      required: [translationRevisionId, selectedText, sourceContext, translatedContext, proposedCorrection, reason]
      properties:
        translationRevisionId:
          type: string
          format: uuid
        selectedText:
          type: string
          minLength: 1
        sourceContext:
          type: string
          minLength: 1
        translatedContext:
          type: string
          minLength: 1
        proposedCorrection:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
    FeedbackReport:
      type: object
      required: [id, novelId, chapterId, translationRevisionId, selectedText, sourceContext, translatedContext, proposedCorrection, reason, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        novelId:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        translationRevisionId:
          type: string
          format: uuid
        selectedText:
          type: string
        sourceContext:
          type: string
        translatedContext:
          type: string
        proposedCorrection:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, needs_review]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MemoryInput:
      type: object
      required: [sourceTerm, preferredRendering, semanticScope, evidence, confidence]
      properties:
        sourceTerm:
          type: string
          minLength: 1
        preferredRendering:
          type: string
          minLength: 1
        semanticScope:
          type: string
          minLength: 1
        evidence:
          type: string
          minLength: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
    MemoryEntry:
      allOf:
        - $ref: '#/components/schemas/MemoryInput'
        - type: object
          required: [id, novelId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            novelId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    FeedbackDecisionInput:
      oneOf:
        - $ref: '#/components/schemas/ApprovedFeedbackDecisionInput'
        - $ref: '#/components/schemas/NonApprovedFeedbackDecisionInput'
    ApprovedFeedbackDecisionInput:
      type: object
      required: [status, memory]
      properties:
        status:
          type: string
          enum: [approved]
        memory:
          $ref: '#/components/schemas/MemoryInput'
    NonApprovedFeedbackDecisionInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [rejected, needs_review]
    FeedbackDecision:
      type: object
      required: [report, revision, memory]
      properties:
        report:
          $ref: '#/components/schemas/FeedbackReport'
        revision:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TranslationRevision'
        memory:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MemoryEntry'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            resourceId:
              type: string
